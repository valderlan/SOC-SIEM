[project]
name = "open-soc-lab"
version = "0.1.0"
description = "Open Source SOC lab: Wazuh HIDS/SIEM health, agent inventory and event validation/injection."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.scripts]
soclab = "soclab.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soclab"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["infra/wazuh-docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soclab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
