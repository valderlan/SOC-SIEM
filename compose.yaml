# Open SOC Lab full containerized stack:
#   - Shuffle SOAR (opensearch, backend, frontend, orborus)
#   - Mailpit (local SMTP + Webmail UI at http://127.0.0.1:8025)
#   - linux-target (Ubuntu + Nginx + OpenSSH + Suricata NIDS + Wazuh Agent + nftables)
#   - soclab (SOAR webhook API sharing linux-target network namespace for isolated live blocking)
#   - kali-attacker (Kali Linux controlled attack runner)
#
# Start everything with: docker compose --profile full up -d
# (or use the 1-click script: .\scripts\up.ps1)
name: soclab

networks:
  soclab-net:
    name: soclab-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  linux-target:
    build:
      context: .
      dockerfile: infra/linux-target/Dockerfile
    image: soclab:linux-target
    hostname: linux-target
    profiles: ["full"]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      WAZUH_MANAGER: wazuh.manager
      WAZUH_AGENT_NAME: linux-target
      SURICATA_INTERFACE: eth0
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:80"
      - "127.0.0.1:2222:22"
    volumes:
      - ./runtime/suricata:/var/log/suricata
      - ./logs:/var/log/soclab:ro
    networks:
      soclab-net:
        ipv4_address: 172.28.0.20
        aliases:
          - linux-target
          - soclab
    restart: unless-stopped

  soclab:
    build:
      context: .
      dockerfile: Dockerfile
    image: soclab:stage4
    profiles: ["full"]
    network_mode: "service:linux-target"
    depends_on:
      - linux-target
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      SOCLAB_API_HOST: 0.0.0.0
      SOCLAB_API_PORT: "8080"
      SOCLAB_AUDIT_LOG_PATH: /app/logs/audit.jsonl
      SOCLAB_EVIDENCE_DIR: /app/logs/evidence
      SOCLAB_STATE_DB_PATH: /app/runtime/soclab_state.db
      SOCLAB_RESPONSE_DRY_RUN: ${SOCLAB_CONTAINER_DRY_RUN:-false}
      SOCLAB_PROTECTED_NETWORKS: 127.0.0.0/8,::1/128,10.0.0.0/8,172.28.0.0/25,192.168.0.0/16,169.254.0.0/16,fc00::/7,fe80::/10
      SOCLAB_WAZUH_URL: https://wazuh.manager:55000
      SOCLAB_SURICATA_EVE_PATH: /var/log/suricata/eve.json
    command: ["soclab", "run", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - ./logs:/app/logs
      - ./runtime:/app/runtime
      - ./runtime/suricata:/var/log/suricata:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    hostname: mailpit
    profiles: ["full"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    networks:
      soclab-net:
        ipv4_address: 172.28.0.14
    restart: unless-stopped

  shuffle-opensearch:
    image: opensearchproject/opensearch:2.11.1
    hostname: shuffle-opensearch
    profiles: ["full"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    networks:
      soclab-net:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  shuffle-backend:
    image: ghcr.io/shuffle/shuffle-backend:latest
    hostname: shuffle-backend
    profiles: ["full"]
    environment:
      SHUFFLE_OPENSEARCH_URL: http://shuffle-opensearch:9200
      ORG_ID: SOCLab
      ENVIRONMENT_NAME: SOCLab
      SHUFFLE_DEFAULT_USERNAME: ${SHUFFLE_DEFAULT_USERNAME:-admin}
      SHUFFLE_DEFAULT_PASSWORD: ${SHUFFLE_DEFAULT_PASSWORD:-soclab-shuffle-admin}
      SHUFFLE_DEFAULT_APIKEY: ${SHUFFLE_DEFAULT_APIKEY:-7f8e9d0c-1a2b-4c3d-8e9f-0a1b2c3d4e5f}
      DOCKER_API_VERSION: "1.44"
      SHUFFLE_APP_HOTLOAD_LOCATION: /shuffle-apps
      SHUFFLE_FILE_LOCATION: /shuffle-files
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime/shuffle-apps:/shuffle-apps
      - ./runtime/shuffle-files:/shuffle-files
    depends_on:
      - shuffle-opensearch
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      soclab-net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  shuffle-frontend:
    image: ghcr.io/shuffle/shuffle-frontend:latest
    hostname: shuffle-frontend
    profiles: ["full"]
    environment:
      BACKEND_HOSTNAME: shuffle-backend
    depends_on:
      - shuffle-backend
    ports:
      - "127.0.0.1:3001:80"
    networks:
      soclab-net:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

  shuffle-orborus:
    image: ghcr.io/shuffle/shuffle-orborus:latest
    container_name: shuffle-orborus
    hostname: shuffle-orborus
    profiles: ["full"]
    environment:
      ENVIRONMENT_NAME: SOCLab
      ORG_ID: SOCLab
      BASE_URL: http://shuffle-backend:5001
      DOCKER_API_VERSION: "1.44"
      SHUFFLE_SWARM_CONFIG: ""
      SHUFFLE_APP_SDK_TIMEOUT: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - shuffle-backend
    networks:
      soclab-net:
        ipv4_address: 172.28.0.13
    restart: unless-stopped

  kali-attacker:
    build:
      context: .
      dockerfile: infra/kali-attacker/Dockerfile
    image: soclab:kali-attacker
    hostname: kali-attacker
    profiles: ["full"]
    networks:
      soclab-net:
        ipv4_address: 172.28.0.200
    restart: unless-stopped
